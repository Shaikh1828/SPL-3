services:
  # FastAPI backend service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archery_scoring_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://archery:archery_pass@db:5432/archery_db
      - REDIS_URL=redis://cache:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - API_WORKERS=2
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - STORAGE_PATH=/storage
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8000
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./runs:/app/runs
      - ./Data:/app/Data
      - storage_volume:/storage
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - archery_network

  # React frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: archery_scoring_frontend
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - archery_network

  # PostgreSQL database service
  db:
    image: postgres:15-alpine
    container_name: archery_scoring_db
    environment:
      - POSTGRES_USER=archery
      - POSTGRES_PASSWORD=archery_pass
      - POSTGRES_DB=archery_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archery -d archery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - archery_network

  # Redis cache service
  cache:
    image: redis:7-alpine
    container_name: archery_scoring_cache
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - archery_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_volume:
    driver: local

networks:
  archery_network:
    driver: bridge
