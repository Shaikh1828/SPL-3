<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gold Bullseye Gradient -->
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Red Ring Gradient -->
    <radialGradient id="redGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Blue Ring Gradient -->
    <radialGradient id="blueGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>

    <!-- Arrow Metallic Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Outer White Target Ring -->
  <circle cx="32" cy="32" r="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
  
  <!-- Black Target Ring -->
  <circle cx="32" cy="32" r="21" fill="#1e293b" stroke="#0f172a" stroke-width="0.8" />
  
  <!-- Blue Target Ring -->
  <circle cx="32" cy="32" r="16" fill="url(#blueGrad)" stroke="#1e40af" stroke-width="0.8" />
  
  <!-- Red Target Ring -->
  <circle cx="32" cy="32" r="11" fill="url(#redGrad)" stroke="#991b1b" stroke-width="0.8" />
  
  <!-- Gold Bullseye 10 Ring & X Ring -->
  <circle cx="32" cy="32" r="6" fill="url(#goldGrad)" stroke="#a16207" stroke-width="0.8" filter="url(#goldGlow)" />
  <circle cx="32" cy="32" r="2.5" fill="none" stroke="#713f12" stroke-width="0.7" stroke-dasharray="1.2 1" />
  <circle cx="32" cy="32" r="0.8" fill="#713f12" />

  <!-- Target Scope Crosshair Reticle -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  <line x1="32" y1="54" x2="32" y2="60" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  <line x1="4" y1="32" x2="10" y2="32" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  <line x1="54" y1="32" x2="60" y2="32" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />

  <!-- Dynamic Precision Arrow Penetrating Center -->
  <g transform="rotate(-45 32 32)">
    <!-- Arrow Shaft with Glow -->
    <line x1="32" y1="12" x2="32" y2="52" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />
    <line x1="32" y1="12" x2="32" y2="52" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    
    <!-- Arrowhead -->
    <polygon points="32,9 27,20 37,20" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
    
    <!-- Fletchings -->
    <polygon points="32,46 25,55 28,55 32,49" fill="#fbbf24" opacity="0.9" />
    <polygon points="32,46 39,55 36,55 32,49" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Glowing Impact Sparkle on Center X -->
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" filter="url(#goldGlow)" />
</svg>
